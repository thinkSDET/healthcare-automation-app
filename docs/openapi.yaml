# Healthcare Automation API — OpenAPI 3.0.3
# Generated from the current backend implementation.
# Do not treat this as a design draft; paths/fields/roles match the code.

openapi: 3.0.3
info:
  title: Healthcare Automation API
  version: 1.0.0
  description: |
    OpenAPI specification generated from the current backend implementation
    (backend/src/routes, controllers, services, validators, middleware).
    
    ## Authentication
    Most endpoints require header:
    `Authorization: Bearer <JWT>`
    
    Obtain JWT via POST /api/auth/login.
    Token claims: userId (number), role (string), email (string).
    Default expiry: 1h. With rememberMe: 30d.
    Secret: process.env.JWT_SECRET or fallback "local-development-secret".
    
    ## Roles (UserRole enum)
    ADMIN, DOCTOR, PHARMACIST, PATIENT, SUPPORT, VIEWER
    
    SUPPORT and VIEWER exist in the schema and can be assigned via admin user APIs.
    They are authorized for read-only audit access via GET /api/audit-events
    (along with ADMIN). Other business routes do not authorize SUPPORT/VIEWER.
    
    ## Base URL
    http://localhost:4000 (PORT hardcoded in backend/src/server.ts)
    
servers:
  - url: "http://localhost:4000"
    description: "Local backend (PORT=4000 in server.ts)"
tags:
  - name: Health
    description: API/database health
  - name: Authentication
    description: "Register, login, password, logout"
  - name: Users
    description: Admin user management
  - name: Patients
    description: Patient CRUD and deactivate
  - name: Dependents
    description: Patient dependents
  - name: Emergency Contact
    description: Patient emergency contact
  - name: Documents
    description: Patient document upload/download
  - name: Medical Profile
    description: Patient medical profile
  - name: Doctors
    description: Doctor directory CRUD
  - name: Appointments
    description: Scheduling and lifecycle
  - name: AppointmentRequests
    description: Patient appointment request and staff approval workflow
  - name: Prescriptions
    description: Prescription CRUD and status
  - name: RefillRequests
    description: Prescription refill and renewal request workflow
  - name: Orders
    description: Pharmacy/order APIs (fulfillment roles include PHARMACIST)
  - name: Audit
    description: Append-only clinical/operational audit trail (read-only)
  - name: Medications
    description: Pharmacy medication catalog and stock adjustments
  - name: ReplenishmentRequests
    description: Medication replenishment request workflow
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      description: "Checks API process and database connectivity via `SELECT 1`. No authentication required."
      operationId: getHealth
      security: []
      responses:
        200:
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUp"
              example:
                status: UP
                database: CONNECTED
                message: Healthcare API is running
        500:
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDown"
              example:
                status: DOWN
                database: DISCONNECTED
                message: Database connection failed
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Public registration
      description: |
        Registers a new user. Public roles allowed: PATIENT, DOCTOR, PHARMACIST.
        ADMIN cannot be created via this endpoint (403).
        Default role if omitted: PATIENT.
        Patient registration requires dateOfBirth, gender, and phone (address optional). Creates User + linked Patient with medicalId PAT-#####.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              firstName: Jane
              lastName: Doe
              email: "jane.doe@example.com"
              password: SecurePass123
              role: PATIENT
              dateOfBirth: 1990-05-15
              gender: FEMALE
              phone: 9876543210
              address: 12 Oak Street
      responses:
        201:
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/RegisteredUser"
              example:
                success: true
                data:
                  id: 10
                  firstName: Jane
                  lastName: Doe
                  email: "jane.doe@example.com"
                  role: PATIENT
        400:
          description: Patient profile fields missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Date of birth, gender, phone and address are required for patient registration."
        403:
          description: Disallowed public role (e.g. ADMIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This account type cannot be created through public registration.
        409:
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email already exists
        500:
          $ref: "#/components/responses/ServerError"
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login and obtain JWT
      description: |
        Authenticates with email + password.
        Returns JWT signed with JWT_SECRET (default fallback: local-development-secret if env unset).
        Token payload: { userId, role, email }.
        expiresIn: "1h" normally, or "30d" when rememberMe is true.
        Locks account after 5 failed attempts for 15 minutes.
        Rejects INACTIVE and LOCKED users.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "admin@healthcare.local"
              password: "Admin@12345"
              rememberMe: false
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                success: true
                message: Login successful
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    id: 1
                    email: "admin@healthcare.local"
                    firstName: System
                    lastName: Administrator
                    role: ADMIN
                    patientId: null
                  expiresIn: 1h
        400:
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email and password are required
        401:
          description: "Invalid credentials, locked account, or inactive/locked user status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Invalid email or password
  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: "Always returns a generic success message (no email enumeration). If the user exists, creates a 15-minute reset token. In development, also returns resetToken and logs it to the server console."
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            example:
              email: "jane.doe@example.com"
      responses:
        200:
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
        400:
          description: Email missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email is required
        500:
          $ref: "#/components/responses/ServerError"
  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: Consumes a one-time reset token from forgot-password.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              token: "<raw-reset-token>"
              newPassword: NewSecurePass123
      responses:
        200:
          description: Password reset
          content:
            application/json:
              example:
                success: true
                message: Password reset successfully
        400:
          description: Missing fields or invalid/expired/used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password (authenticated)
      description: Requires Bearer JWT. Any authenticated role. Updates passwordHash for the token subject userId.
      operationId: changePassword
      security:
        - BearerAuth: 

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              currentPassword: OldPass123
              newPassword: NewPass456
      responses:
        200:
          description: Password changed
          content:
            application/json:
              example:
                success: true
                message: Password changed successfully
        400:
          description: Validation or password rule failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout contract
      description: JWT is stateless. This endpoint requires authentication and returns success so clients have a logout API contract. Token invalidation is client-side.
      operationId: logout
      security:
        - BearerAuth: 

      responses:
        200:
          description: Logout acknowledged
          content:
            application/json:
              example:
                success: true
                message: Logout successful
        401:
          $ref: "#/components/responses/Unauthorized"
  /api/users:
    get:
      tags:
        - Users
      summary: List users
      description: "Roles: ADMIN. Others receive 403. Requires Bearer JWT."
      operationId: getUsers
      security:
        - BearerAuth: 

      responses:
        200:
          description: User list (passwordHash excluded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPublic"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Users
      summary: Create user (admin)
      description: "Roles: ADMIN. Others receive 403. Requires Bearer JWT. Zod roles: ADMIN, DOCTOR, PHARMACIST, SUPPORT, VIEWER (PATIENT not in createUserSchema). Field passwordHash is the request field name (min 8) — stored as-is into User.passwordHash by the service (caller is expected to supply an already-hashed value based on field naming)."
      operationId: createUser
      security:
        - BearerAuth: 

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              firstName: Alex
              lastName: Admin
              email: "alex@example.com"
              passwordHash: plaintextOrHashMin8
              role: SUPPORT
      responses:
        201:
          description: Created — returns prisma user create result (includes passwordHash)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/UserRecord"
        400:
          $ref: "#/components/responses/ValidationError"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: "Roles: ADMIN. Others receive 403. Requires Bearer JWT."
      operationId: getUserById
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/UserPublic"
        400:
          description: Invalid user ID
          content:
            application/json:
              example:
                success: false
                message: Invalid user ID
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/ServerError"
    put:
      tags:
        - Users
      summary: Update user
      description: "Roles: ADMIN. Others receive 403. Requires Bearer JWT."
      operationId: updateUser
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              status: INACTIVE
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/UserRecord"
        400:
          $ref: "#/components/responses/ValidationError"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Users
      summary: Delete user
      description: "Roles: ADMIN. Others receive 403. Requires Bearer JWT."
      operationId: deleteUser
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        204:
          description: Deleted (empty body)
        400:
          description: Invalid user ID
          content:
            application/json:
              example:
                success: false
                message: Invalid user ID
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
  /api/patients:
    get:
      tags:
        - Patients
      summary: List patients
      description: "Roles: ADMIN, DOCTOR. PATIENT/PHARMACIST → 403."
      operationId: getPatients
      security:
        - BearerAuth: 

      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Patient"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Patients
      summary: Create patient
      description: "Roles: ADMIN, DOCTOR. Validated by createPatientSchema."
      operationId: createPatient
      security:
        - BearerAuth: 

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
            example:
              medicalId: PAT-90001
              firstName: John
              lastName: Smith
              dateOfBirth: 1985-03-20
              gender: MALE
              email: "john.smith@example.com"
              phone: 9876543210
              address: 45 Pine Ave
              bloodGroup: O+
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Patient"
        400:
          $ref: "#/components/responses/ValidationError"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
  /api/patients/{id}:
    get:
      tags:
        - Patients
      summary: Get patient by ID
      description: |
        Access control via requirePatientAccess:
        - ADMIN, DOCTOR: any patientId
        - PATIENT: only when Patient.userId === JWT userId
        - Other roles (e.g. PHARMACIST): 403 "You do not have permission to access patient records"
        Invalid id → 400. Missing patient for PATIENT ownership check → 404.
      operationId: getPatientById
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Patient"
        400:
          description: Invalid patient ID
          content:
            application/json:
              example:
                success: false
                message: Invalid patient ID
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/ServerError"
    put:
      tags:
        - Patients
      summary: Update patient
      description: |
        Access control via requirePatientAccess:
        - ADMIN, DOCTOR: any patientId
        - PATIENT: only when Patient.userId === JWT userId
        - Other roles (e.g. PHARMACIST): 403 "You do not have permission to access patient records"
        Invalid id → 400. Missing patient for PATIENT ownership check → 404. Validated by updatePatientSchema.
      operationId: updatePatient
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
            example:
              phone: 9998887776
              address: New address
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Patient"
        400:
          $ref: "#/components/responses/ValidationError"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Patients
      summary: Permanently delete patient
      description: "Roles: ADMIN only."
      operationId: deletePatient
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
      responses:
        204:
          description: Deleted (empty body)
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
  /api/patients/{id}/deactivate:
    patch:
      tags:
        - Patients
      summary: Deactivate patient
      description: "Roles: ADMIN, DOCTOR. Sets status to INACTIVE."
      operationId: deactivatePatient
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
      responses:
        200:
          description: Deactivated
          content:
            application/json:
              example:
                success: true
                message: Patient deactivated successfully
                data:
                  id: 1
                  status: INACTIVE
        400:
          description: Invalid ID or already inactive
          content:
            application/json:
              example:
                success: false
                message: Patient is already inactive
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/ServerError"
  /api/patients/{id}/dependents:
    get:
      tags:
        - Dependents
      summary: List dependents
      description: |
        Access control via requirePatientAccess:
        - ADMIN, DOCTOR: any patientId
        - PATIENT: only when Patient.userId === JWT userId
        - Other roles (e.g. PHARMACIST): 403 "You do not have permission to access patient records"
        Invalid id → 400. Missing patient for PATIENT ownership check → 404.
      operationId: getPatientDependents
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PatientDependent"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Dependents
      summary: Add dependent
      description: |
        Access control via requirePatientAccess:
        - ADMIN, DOCTOR: any patientId
        - PATIENT: only when Patient.userId === JWT userId
        - Other roles (e.g. PHARMACIST): 403 "You do not have permission to access patient records"
        Invalid id → 400. Missing patient for PATIENT ownership check → 404. Required body fields: firstName, lastName, relationship. Optional: dateOfBirth, gender, phone, email.
      operationId: createPatientDependent
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDependentRequest"
            example:
              firstName: Sam
              lastName: Smith
              relationship: Child
              dateOfBirth: 2015-01-01
              gender: MALE
      responses:
        201:
          description: Dependent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/PatientDependent"
        400:
          description: Missing required fields or invalid patient ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/ServerError"
  /api/patients/{id}/dependents/{dependentId}:
    delete:
      tags:
        - Dependents
      summary: Delete dependent
      description: |
        Access control via requirePatientAccess:
        - ADMIN, DOCTOR: any patientId
        - PATIENT: only when Patient.userId === JWT userId
        - Other roles (e.g. PHARMACIST): 403 "You do not have permission to access patient records"
        Invalid id → 400. Missing patient for PATIENT ownership check → 404.
      operationId: deletePatientDependent
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
        - name: dependentId
          in: path
          required: true
          schema:
            type: integer
          description: Dependent ID
      responses:
        200:
          description: Removed
          content:
            application/json:
              example:
                success: true
                message: Dependent removed successfully
        400:
          description: Invalid dependent ID
          content:
            application/json:
              example:
                success: false
                message: Invalid dependent ID
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/ServerError"
  /api/patients/{id}/emergency-contact:
    get:
      tags:
        - Emergency Contact
      summary: Get emergency contact
      description: |
        Access control via requirePatientAccess:
        - ADMIN, DOCTOR: any patientId
        - PATIENT: only when Patient.userId === JWT userId
        - Other roles (e.g. PHARMACIST): 403 "You do not have permission to access patient records"
        Invalid id → 400. Missing patient for PATIENT ownership check → 404. data may be null if none saved.
      operationId: getPatientEmergencyContact
      security:
        - BearerAuth: 

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Patient ID
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/EmergencyContact"
        400:
