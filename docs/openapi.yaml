      tags: [Medications]
      summary: Adjust medication stock
      description: "Roles: ADMIN, PHARMACIST. Reason required. Result qty cannot be negative."
      operationId: adjustMedicationStock
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta, reason]
              properties:
                delta: { type: integer }
                reason: { type: string, minLength: 3 }
      responses:
        200:
          description: Adjusted
        400:
          description: Invalid delta / negative stock / inactive
        409:
          description: Concurrent update
  /api/medications/{id}/movements:
    get:
      tags: [Medications]
      summary: List stock movements
      operationId: listMedicationMovements
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        200:
          description: Success
  /api/replenishment-requests:
    get:
      tags: [ReplenishmentRequests]
      summary: List replenishment requests
      operationId: listReplenishmentRequests
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [SUBMITTED, APPROVED, REJECTED, CANCELLED, RECEIVED]
        - name: medicationId
          in: query
          schema: { type: integer }
      responses:
        200:
          description: Success
    post:
      tags: [ReplenishmentRequests]
      summary: Create replenishment request
      operationId: createReplenishmentRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medicationId, requestedQuantity]
              properties:
                medicationId: { type: integer }
                requestedQuantity: { type: integer, minimum: 1 }
                notes: { type: string }
      responses:
        201:
          description: Created
        409:
          description: Duplicate open request
  /api/replenishment-requests/{id}:
    get:
      tags: [ReplenishmentRequests]
      summary: Get replenishment request
      operationId: getReplenishmentRequestById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Success
        404:
          $ref: "#/components/responses/NotFound"
  /api/replenishment-requests/{id}/status:
    patch:
      tags: [ReplenishmentRequests]
      summary: Update replenishment status
      description: |
        APPROVE/REJECT: ADMIN only.
        CANCEL: ADMIN or requester from SUBMITTED.
        RECEIVE: ADMIN/PHARMACIST from APPROVED; increases stock.
      operationId: updateReplenishmentRequestStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED, CANCELLED, RECEIVED]
                rejectionReason: { type: string }
                receivedQuantity: { type: integer, minimum: 1 }
      responses:
        200:
          description: Updated
        403:
          $ref: "#/components/responses/Forbidden"
        400:
          description: Invalid transition
  /api/audit-events:
    get:
      tags:
        - Audit
      summary: List audit events
      description: |
        Roles: ADMIN, VIEWER, SUPPORT.
        Append-only operational trail. No create/update/delete endpoints.
        Sorted by occurredAt descending. Default limit 50, max 100.
      operationId: listAuditEvents
      security:
        - BearerAuth: []
      parameters:
        - name: actorUserId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
            enum:
              - CREATE
              - UPDATE
              - STATUS_CHANGE
              - APPROVE
              - REJECT
              - CANCEL
              - DELETE
        - name: entityType
          in: query
          schema:
            type: string
            enum:
              - PATIENT
              - APPOINTMENT
              - APPOINTMENT_REQUEST
              - PRESCRIPTION
              - REFILL_REQUEST
              - ORDER
              - MEDICATION
              - REPLENISHMENT_REQUEST
        - name: entityId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
        400:
          $ref: "#/components/responses/ValidationError"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Send header: Authorization: Bearer <token> from login response data.token"
  responses:
    Unauthorized:
      description: "Missing, invalid, or expired Bearer token"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Authentication token is required
    Forbidden:
      description: Authenticated but role not allowed (or patient ownership failed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: You do not have permission to access this resource
    ValidationError:
      description: Request body failed Zod validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Validation failed
            errors:
              - field: email
                message: Invalid email
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          description: Present on Zod validation failures (HTTP 400)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    HealthUp:
      type: object
      properties:
        status:
          type: string
          example: UP
        database:
          type: string
          example: CONNECTED
        message:
          type: string
    HealthDown:
      type: object
      properties:
        status:
          type: string
          example: DOWN
        database:
          type: string
          example: DISCONNECTED
        message:
          type: string
    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum:
            - PATIENT
            - DOCTOR
            - PHARMACIST
          default: PATIENT
        dateOfBirth:
          type: string
          description: Required when role is PATIENT
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
          description: Required when role is PATIENT
        phone:
          type: string
          description: Required when role is PATIENT
        address:
          type: string
    RegisteredUser:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
          default: false
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            token:
              type: string
            user:
              type: object
              properties:
                id:
                  type: integer
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                patientId:
                  type: integer
                  nullable: true
                  description: Linked Patient.id when present
            expiresIn:
              type: string
              example: 1h
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    ForgotPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        resetToken:
          type: string
          description: Returned in current development implementation when user exists
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    UserPublic:
      type: object
      properties:
        id:
          type: integer
