          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Appointments
      summary: Create appointment
      description: |
        Roles: ADMIN only. Status transitions (from → allowed next):
        - SCHEDULED → CONFIRMED | CANCELLED | NO_SHOW
        - CONFIRMED → CHECKED_IN
        - CHECKED_IN → IN_CONSULTATION
        - IN_CONSULTATION → COMPLETED
        - COMPLETED | CANCELLED | NO_SHOW → (terminal, no further changes)
        
        Role targets for PATCH status:
        - ADMIN may transition to: CONFIRMED, CHECKED_IN, IN_CONSULTATION, COMPLETED, CANCELLED, NO_SHOW
        - DOCTOR may transition to: CONFIRMED, CHECKED_IN, IN_CONSULTATION, COMPLETED, NO_SHOW (not CANCELLED via status endpoint)
        DELETE /api/appointments/:id cancels only when status is SCHEDULED (ADMIN).
        Rejects past appointmentAt, inactive doctor, overlapping doctor/patient appointments (active statuses).
      operationId: createAppointment
      security:
        - BearerAuth: 

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
            example:
              appointmentNo: APT-20260811-001
              patientId: 1
              doctorId: 1
              appointmentAt: "2026-09-01T10:00:00.000Z"
              duration: 30
              type: IN_PERSON
              reason: Annual checkup
              notes: Fasting labs preferred
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AppointmentWithRelations"
        400:
