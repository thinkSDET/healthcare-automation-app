  /api/appointments:
    get:
      tags:
        - Appointments
      summary: List appointments
      description: "Roles: ADMIN, DOCTOR. Includes patient and doctor relations."
      operationId: getAppointments
      security:
        - BearerAuth: 

      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppointmentWithRelations"
        401:
          $ref: "#/components/responses/Unauthorized"
